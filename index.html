<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevra Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main>
        <img src="assets/logo.gif" alt="logo" class="logo-img">
        <label>
            <p>Converter <b>de</b></p>
            <select>
                <option value="real"> R$ Real Brasileiro </option>
            </select>
        </label>

        <label>
            <p>Converter <b>para</b></p>
            <select class="select-output">
                <option value="dolar"> Dólar Americano </option>
                <option value="euro"> Euro </option>
                <option value="libra"> Libra Esterlina </option>
                <option value="bitcoin"> Bitcoin </option>
            </select>
        </label>

        <label>
            <p> Valor </p>
            <input type="number" class="input-value" placeholder="10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="conversion-box">
                <img src="./assets/brl.png" alt="brl" class="currency-brl">
                <p class="currency"> Real </p>
                <p class="currency-to-convert"> R$ 0,00 </p>
            </div>

            <img src="./assets/arrow.png" alt="arrow" class="arrow-image">

            <div class="conversion-box">
                <img src="./assets/usd.png" alt="usd" class="currency-usd">
                <p class="currency" id="currency-name"> Dólar Americano </p>
                <p class="currency-converted"> $0.00 </p>
            </div>
        </section>
    </main>

</body>

<script src="./script.js"></script>

</html>
